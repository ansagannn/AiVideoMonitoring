# Free camera-viewing demo. No server-side YOLO; history is ephemeral.
services:
  - type: web
    name: ai-camera-safety-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: AI_MONITOR_PASSWORD_ADMIN
        sync: false
      - key: AI_MONITOR_PASSWORD_MANAGER
        sync: false
      - key: AI_MONITOR_PASSWORD_OPERATOR
        sync: false
